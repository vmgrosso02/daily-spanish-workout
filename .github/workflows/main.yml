name: Daily Spanish Workout

on:
  workflow_dispatch: # Allows manual triggers
  schedule:
    # Triggers ~5:17 AM EDT (9:17 UTC) — Mar through Oct
    - cron: '17 9 * 3,4,5,6,7,8,9,10 *'
    # Triggers ~5:17 AM EST (10:17 UTC) — Nov, Dec, Jan, Feb
    - cron: '17 10 * 1,2,11,12 *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python generate_workout.py

      - name: Commit updated word and phrase banks
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add word_bank.json phrase_bank.json word_bank.txt phrase_bank.txt spanish_vocab.txt
          git diff --staged --quiet || git commit -m "Automated update of word & phrase banks [skip ci]"
          git push
